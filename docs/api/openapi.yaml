openapi: 3.0.3
info:
  title: SportsCam API
  version: 0.1.0
  description: MVP API contract for projects, edge devices, recordings, events and clips.
servers:
  - url: http://localhost:3000
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        '200': {description: OK}
  /v1/auth/register:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201': {description: Created}
        '400': {description: Invalid request}
  /v1/auth/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200': {description: Authenticated}
        '401': {description: Invalid credentials}
  /v1/projects:
    get:
      responses:
        '200': {description: Project list}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectDefinition'
      responses:
        '201': {description: Created}
        '400': {description: Invalid project}
  /v1/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get: {responses: {'200': {description: Project}, '404': {description: Not found}}}
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectDefinition'
      responses:
        '200': {description: Updated}
    delete: {responses: {'204': {description: Deleted}}}
  /v1/engine/resolve:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectDefinition'
      responses:
        '200':
          description: Deterministic resolution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineResult'
  /v1/edge/devices/register:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
      responses:
        '201': {description: Registered}
  /v1/edge/devices/{deviceId}/heartbeat:
    post:
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceHeartbeat'
      responses:
        '200': {description: Accepted}
  /v1/edge/devices/{deviceId}/commands:
    get:
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - in: query
          name: after
          schema: {type: string}
      responses:
        '200': {description: Commands}
  /v1/edge/devices/{deviceId}/commands/{commandId}/ack:
    post:
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - in: path
          name: commandId
          required: true
          schema: {type: string}
      responses:
        '204': {description: Acknowledged}
  /v1/projects/{projectId}/events:
    post:
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '201': {description: Event created}
  /v1/projects/{projectId}/clips:
    post:
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClipCreate'
      responses:
        '202': {description: Clip queued}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: {type: string}
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: {type: string}
    DeviceId:
      in: path
      name: deviceId
      required: true
      schema: {type: string}
  schemas:
    RegisterRequest:
      type: object
      required: [organizationName,slug,email,displayName,password]
      properties:
        organizationName: {type: string}
        slug: {type: string}
        email: {type: string, format: email}
        displayName: {type: string}
        password: {type: string, minLength: 12}
    LoginRequest:
      type: object
      required: [email,password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
    ProjectDefinition:
      type: object
      required: [project]
      properties:
        project:
          type: object
          required: [id,version,sport,modules]
          properties:
            id: {type: string}
            version: {type: string}
            sport: {type: string}
            modules: {type: array, items: {type: string}}
            hardware: {type: array, items: {type: object, required: [id,quantity], properties: {id: {type: string}, quantity: {type: integer, minimum: 1}}}}
            profile: {type: string}
    EngineResult:
      type: object
      required: [valid,engineVersion,modules,compatibleHardware,dependencies,appliedRules,bom,diagnostics]
      properties:
        valid: {type: boolean}
        engineVersion: {type: string}
        modules: {type: array, items: {type: string}}
        compatibleHardware: {type: array, items: {type: string}}
        dependencies: {type: array, items: {type: string}}
        appliedRules: {type: array, items: {type: string}}
        bom: {type: array, items: {type: object}}
        diagnostics: {type: array, items: {type: object}}
    DeviceRegistration:
      type: object
      required: [deviceId,organizationId,agentVersion]
      properties:
        deviceId: {type: string}
        organizationId: {type: string}
        agentVersion: {type: string}
        hardwareProfile: {type: string}
    DeviceHeartbeat:
      type: object
      required: [deviceId,sentAt,status,agentVersion]
      properties:
        deviceId: {type: string}
        sentAt: {type: string, format: date-time}
        status: {type: string, enum: [online,degraded,offline]}
        agentVersion: {type: string}
        metrics: {type: object}
        cameraStates: {type: array, items: {type: object}}
    EventCreate:
      type: object
      required: [timestampMs,type,source]
      properties:
        recordingId: {type: string}
        timestampMs: {type: integer, minimum: 0}
        type: {type: string}
        source: {type: string, enum: [manual,sensor,integration,algorithm,ai]}
        metadata: {type: object}
    ClipCreate:
      type: object
      required: [eventId,preSeconds,postSeconds]
      properties:
        eventId: {type: string}
        preSeconds: {type: number, minimum: 0}
        postSeconds: {type: number, minimum: 0}
